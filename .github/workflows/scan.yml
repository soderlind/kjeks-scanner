name: Kjeks discovery scan

on:
  schedule:
    # Weekly, Monday 03:00 UTC. Adjust to your needs.
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    # Backstop: the scanner bounds every network await, but cap the whole job
    # so a runaway can never burn the 6h ceiling.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 20

      - name: Install scanner dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run scan
        id: scan
        # Non-zero exit means a subsite changed; keep going so we can commit + import.
        continue-on-error: true
        env:
          # Preferred: a shared key from `wp kjeks scan-key --generate`, sent in
          # the X-Kjeks-Key header (survives proxies that strip Authorization).
          KJEKS_SCAN_KEY: ${{ secrets.KJEKS_SCAN_KEY }}
          # Fallback: a WordPress application password via HTTP Basic auth.
          KJEKS_USER: ${{ secrets.KJEKS_USER }}
          KJEKS_APP_PASSWORD: ${{ secrets.KJEKS_APP_PASSWORD }}
        # Fetch the site list from WordPress over REST, then import in the same run.
        # Import runs when either KJEKS_SCAN_KEY or KJEKS_APP_PASSWORD is set.
        # Add `--overlay overlay.json` to merge repo-side paths/scenarios.
        run: >-
          node src/cli.js
          --config-url "${{ secrets.KJEKS_SITE_URL }}/wp-json/kjeks/v1/scan-config"
          ${{ ( secrets.KJEKS_SCAN_KEY != '' || secrets.KJEKS_APP_PASSWORD != '' ) && '--import' || '' }}
          --out scan

      - name: Upload full scan artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: kjeks-scan
          path: scan/

      - name: Commit baseline changes
        run: |
          if [[ -n "$(git status --porcelain scan)" ]]; then
            git config user.name "kjeks-scanner"
            git config user.email "kjeks-scanner@users.noreply.github.com"
            git add scan
            git commit -m "chore(scan): update discovery baseline"
            git push
          else
            echo "No baseline changes."
          fi
